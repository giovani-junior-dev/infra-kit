# Portainer CE + agent (etapa 40). Sem porta publicada: acesso só por
# https://portainer.<domínio> atrás do Access. Lição L2: tudo declarado aqui.
# TODO(release): fixar por digest.
services:
  agent:
    image: portainer/agent:2.45.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks: [infra_net]
    deploy:
      mode: global
      placement: { constraints: [node.platform.os == linux] }

  portainer:
    image: portainer/portainer-ce:2.45.2
    command: [-H, "tcp://tasks.agent:9001", --tlsskipverify, --admin-password-file, /run/secrets/portainer_admin_pw]
    secrets: [portainer_admin_pw]
    volumes: [portainer_data:/data]
    networks: [infra_net]
    deploy:
      replicas: 1
      placement: { constraints: [node.role == manager] }
      resources: { limits: { memory: 512M } }

secrets:
  portainer_admin_pw: { external: true }

volumes:
  portainer_data:

networks:
  infra_net: { external: true }
